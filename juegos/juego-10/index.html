    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
// R2 · "La ruleta de los climas" — GIRAR el aro (verbo nuevo).
// Los 6 tipos de clima van en un aro que se arrastra en círculo; el niño lo gira hasta
// dejar bajo la FLECHA fija el clima que describe la tarjeta, y ¡VERIFICAR! valida.
// UNA jugada por ronda ⇒ vale +3 ⭐ de golpe, igual que la R2 del Tema 1.
//
// ⚠ Las 6 características son LITERALES de la tabla "Tipos de climas alrededor del
// mundo" (p. 49). Los nombres van en singular ("TROPICAL", "ALTA MONTAÑA") porque así
// los escribe el cuaderno en la actividad 3; la tabla los lista en plural.
//
// ⚠ Cada pastilla lleva una CONTRA-ROTACIÓN (`-(ang + i·60)`) para que su texto quede
// siempre horizontal: si girara con el aro, las de abajo se leerían de cabeza. La
// transición es la misma en el aro y en la pastilla, si no se desincronizan al encajar.
//
// ⚠ El aro NUNCA arranca con la respuesta bajo la flecha (se sortea otra posición): la
// ronda se ganaría sin jugar.
// ══════════════════════════════════════════════════════════════════
const J10_CL_CLIMAS = [
  { id: "tropical", n: "TROPICAL", e: "🌴", d: "Temperaturas cálidas durante todo el año y alta humedad, zonas de lluvias constantes y bosques tropicales. Se ubican en torno a la línea ecuatorial." },
  { id: "seco", n: "SECO", e: "🏜️", d: "Escasas precipitaciones, altas temperaturas diurnas y bajas en la noche." },
  { id: "templado", n: "TEMPLADO", e: "🍂", d: "Estaciones de veranos cálidos e inviernos fríos, precipitaciones promedio." },
  { id: "continental", n: "CONTINENTAL", e: "❄️", d: "Inviernos muy fríos con estaciones intermedias (otoño y primavera) muy cortas." },
  { id: "polar", n: "POLAR", e: "🧊", d: "Temperaturas muy frías durante todo el año. Se presentan en las zonas polares del planeta." },
  { id: "montana", n: "ALTA MONTAÑA", e: "🏔️", d: "Climas relacionados con la altitud, característicos de las cordilleras." },
];

const J10_CL_R2_KEY = "edinun_j10_cl_r2_v1";
function j10ClR2Build() {
  // 1 de 6 ⇒ cap alto (banco−1) = máxima variedad al recargar.
  const i = j10PickIdx(J10_CL_CLIMAS, 1, J10_CL_R2_KEY)[0];
  j10Commit(J10_CL_R2_KEY, [i], 5);
  const target = J10_CL_CLIMAS[i];
  const aro = j10Shuffle(J10_CL_CLIMAS);              // el orden del aro cambia cada ronda
  const ok = aro.findIndex((c) => c.id === target.id);
  let k = Math.floor(Math.random() * 6);
  while (k === ok) k = Math.floor(Math.random() * 6);
  return { target, aro, ok, ang0: -k * 60 };
}

function R2Ruleta({ onSolve, verifyRef }) {
  const [b] = useStateG(() => j10ClR2Build());
  const [ang, setAng] = useStateG(() => b.ang0);
  const [spin, setSpin] = useStateG(false);
  const [verified, setVerified] = useStateG(false);
  const dialRef = useRefG(null);
  const dragInfo = useRefG(null);
  const pastRefs = useRefG({});
  // Ranura bajo la flecha: la pastilla i se dibuja girada `i·60 + ang` desde arriba, y la
  // flecha está justo arriba ⇒ está seleccionada la que cumple `i·60 + ang ≡ 0`.
  const sel = ((-Math.round(ang / 60)) % 6 + 6) % 6;

  function angDe(e) {
    const r = dialRef.current.getBoundingClientRect();
    return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
  }
  function onDown(e) {
    if (verified) return;
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    dragInfo.current = { last: angDe(e), moved: false };
    setSpin(true);
  }
  function onMove(e) {
    const di = dragInfo.current; if (!di) return;
    const a = angDe(e);
    // El ángulo de atan2 salta de +180 a −180: el delta se normaliza antes de acumular,
    // si no el aro pega un giro completo al cruzar esa línea.
    let d = a - di.last;
    if (d > 180) d -= 360; else if (d < -180) d += 360;
    di.last = a;
    if (Math.abs(d) > 0.4) di.moved = true;
    setAng((v) => v + d);
  }
  function onUp(e) {
    const di = dragInfo.current; if (!di) return;
    dragInfo.current = null; setSpin(false);
    // ⚠ El RESPALDO TAP se resuelve AQUÍ, no con un onClick en la pastilla. El aro captura
    // el puntero al empezar (`setPointerCapture`, necesario para que el arrastre no se
    // corte al salirse del círculo), y con el puntero capturado el `click` posterior se
    // dispara sobre el aro y NO sobre la pastilla: el toque se perdía y la ruleta se
    // quedaba siempre en su posición inicial —que a propósito nunca es la respuesta—, así
    // que la ronda era imposible de acertar sin arrastrar. Cazado por el e2e (partida
    // "perfecta" que daba 7 ⭐ en vez de 10).
    if (!di.moved) { const i = pastillaEn(e); if (i !== null) { irA(i); return; } }
    setAng((v) => Math.round(v / 60) * 60);          // encaja en la ranura más cercana
  }
  function pastillaEn(e) {
    if (!e || e.clientX === undefined) return null;
    for (let i = 0; i < 6; i++) {
      const el = pastRefs.current[i]; if (!el) continue;
      const r = el.getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) return i;
    }
    return null;
  }
  // Respaldo tap: tocar una pastilla GIRA el aro hasta ponerla bajo la flecha (por el
  // camino corto), en vez de seleccionarla en seco — así el gesto sigue siendo girar.
  function irA(i) {
    if (verified) return;
    setAng((v) => v + (((-i * 60 - v) % 360 + 540) % 360 - 180));
  }

  function verificar() {
    if (verified) return;
    setSpin(false); dragInfo.current = null;
    setVerified(true);
    const elegido = b.aro[sel];
    const acierto = elegido.id === b.target.id;
    onSolve(acierto, {
      emoji: "🌡️", a: "¿De qué tipo de clima habla la tarjeta?",
      userAnswer: elegido.n, correctAnswer: b.target.n,
    }, acierto ? 3 : 0);
  }
  verifyRef.current = verificar;

  const trans = spin ? "none" : "transform 0.28s cubic-bezier(0.22,1,0.36,1)";
  function pastilla(c, i) {
    const enFlecha = i === sel;
    const esOk = verified && c.id === b.target.id;
    const esFallo = verified && enFlecha && c.id !== b.target.id;
    let border = "#d9c48a", bg = "linear-gradient(180deg,#fffdf6,#f6ecd2)", col = "#3a2608";
    if (!verified && enFlecha) { border = "#4fd8ff"; bg = "linear-gradient(180deg,#eaf9ff,#cdeeff)"; }
    if (esOk) { border = "#2ecc8f"; bg = "linear-gradient(180deg,rgba(72,224,154,0.96),rgba(26,143,95,0.94))"; col = "#06381f"; }
    else if (esFallo) { border = "#ff6b6b"; bg = "linear-gradient(180deg,rgba(255,139,139,0.94),rgba(178,47,47,0.92))"; col = "#fff"; }
    // El brazo lleva la rotación del aro (`i·60 + ang`): es lo que hace que las seis
    // pastillas GIREN de verdad. La pastilla se contra-rota lo mismo para que su texto
    // quede siempre horizontal (si girara con el aro, las de abajo se leerían de cabeza),
    // y ambas transiciones son idénticas para que no se desincronicen al encajar. Los dos
    // `pointerEvents: none` dejan pasar el gesto al aro, que es quien arrastra y quien
    // resuelve el toque.
    return (
      <div key={c.id} style={{ position: "absolute", left: "50%", top: "50%", width: 0, height: 0, pointerEvents: "none", transform: `rotate(${i * 60 + ang}deg) translateY(-83px)`, transition: trans }}>
        <button ref={(el) => { pastRefs.current[i] = el; }} disabled={verified}
          style={{ position: "absolute", left: -42, top: -17, width: 84, height: 34, boxSizing: "border-box", pointerEvents: "none", borderRadius: 10, border: `2.5px solid ${border}`, background: bg, color: col, fontFamily: "var(--ed-font-display)", fontWeight: 800, fontSize: 9.5, letterSpacing: "-0.01em", lineHeight: 1.05, padding: "2px 3px", cursor: verified ? "default" : "pointer", transform: `rotate(${-(i * 60) - ang}deg)`, transition: trans, boxShadow: enFlecha ? "0 0 16px rgba(79,216,255,0.6), inset 0 1px 0 rgba(255,255,255,0.7)" : "inset 0 1px 0 rgba(255,255,255,0.7), 0 3px 8px rgba(0,0,0,0.26)" }}>
          {c.n}
          {(esOk || esFallo) && (
            <span style={{ position: "absolute", top: -8, right: -7, fontSize: 10, fontWeight: 900, color: "#fff", background: esOk ? "#1f8a54" : "#c0392b", borderRadius: "50%", width: 18, height: 18, display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 2px 5px rgba(0,0,0,0.35)" }}>{esOk ? "✓" : "✗"}</span>
          )}
        </button>
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-start", height: "100%", width: "100%", paddingTop: 58 }}>
      <div style={{ pointerEvents: "none", textAlign: "center", textShadow: "0 2px 8px rgba(0,0,0,0.6)" }}>
        <span style={{ fontFamily: "var(--ed-font-display)", fontWeight: 800, fontSize: 20, color: "#fff" }}>Descubre de qué clima habla la tarjeta.</span>
      </div>
      <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 6, minHeight: 0, width: "100%" }}>
        {/* Tarjeta con la característica (literal de la tabla de la p. 49). */}
        <div style={{ width: 446, boxSizing: "border-box", flexShrink: 0, borderRadius: 14, border: "3px solid #f2c260", background: "linear-gradient(180deg, rgba(255,255,255,0.96), rgba(240,235,225,0.92))", padding: "9px 13px", boxShadow: "0 10px 24px rgba(0,0,0,0.4)", fontFamily: "var(--ed-font-ui)", fontSize: 12.5, lineHeight: 1.3, color: "#3a2608", textAlign: "center" }}>
          {b.target.d}
        </div>
        {/* Flecha FIJA: marca la ranura que cuenta. */}
        <div style={{ flexShrink: 0, fontSize: 17, lineHeight: 1, color: "#fce9a8", textShadow: "0 0 10px rgba(252,233,168,0.9)" }}>▼</div>
        <div ref={dialRef} onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}
          style={{ position: "relative", width: 260, height: 260, flexShrink: 0, borderRadius: "50%", border: "3px solid rgba(242,194,96,0.75)", background: "radial-gradient(circle at 50% 42%, rgba(46,94,150,0.5), rgba(11,38,66,0.62))", boxShadow: "0 10px 26px rgba(0,0,0,0.4)", cursor: verified ? "default" : "grab", touchAction: "none" }}>
          {/* Buje decorativo: el planeta. No lleva el emoji del clima — delataría la
              respuesta antes de girar. */}
          <div style={{ position: "absolute", left: "50%", top: "50%", width: 78, height: 78, marginLeft: -39, marginTop: -39, borderRadius: "50%", border: "2.5px solid rgba(242,194,96,0.55)", background: "rgba(0,0,0,0.3)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 36, lineHeight: 1, pointerEvents: "none" }}>🌍</div>
          {b.aro.map((c, i) => pastilla(c, i))}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
// R3 · "El lugar misterioso" — DESTAPAR pistas y deducir (verbo nuevo).
// Tres sobres cerrados; el niño abre los que necesite y toca el lugar del que hablan.
// ¡VERIFICAR! valida (una ronda = UNA jugada) ⇒ +3 ⭐.
//
// ⚠ Se puede acertar con UNA sola pista: abrirlas todas no es obligatorio y no cuesta
// estrellas. Es lo que hace que la ronda sea investigar y no leer un enunciado largo.
//
// ⚠ CÓMO SE GARANTIZA QUE HAY UNA SOLA RESPUESTA:
//   1. las 4 opciones de la ronda tienen SIEMPRE climas distintos (el banco de lugares
//      tiene un lugar por clima), y
//   2. de las 3 pistas, al menos una está marcada `clave: true` — es decir, describe algo
//      que en la tabla del libro solo cumple ese clima.
//   Sin (2) podían salir tres pistas compartidas (p. ej. "tiene cuatro estaciones", que
//   vale para templado Y continental) y la ronda no tendría solución.
//
// ⚠ Los lugares salen del CUADERNO: la actividad 3 empareja clima tropical→Amazonía,
// alta montaña→cordillera de los Andes, seco→desierto del Sahara y polar→Antártida; la
// actividad 4 da Japón como ejemplo de templado y Siberia de continental.
// ══════════════════════════════════════════════════════════════════
const J10_CL_LUGARES = [
  { id: "amazonia", n: "Amazonía", e: "🌴", clima: "tropical" },
  { id: "andes", n: "Cordillera de los Andes", e: "🏔️", clima: "montana" },
  { id: "sahara", n: "Desierto del Sahara", e: "🏜️", clima: "seco" },
  { id: "antartida", n: "Antártida", e: "🧊", clima: "polar" },
  { id: "siberia", n: "Siberia", e: "🌲", clima: "continental" },
  { id: "japon", n: "Japón", e: "🗾", clima: "templado" },
];

// Pistas por clima — todas de la tabla de la p. 49, del mapa de zonas de la p. 49 o de
// las actividades 3 y 4 del cuaderno. `clave` = dato que solo cumple ESE clima.
const J10_CL_PISTAS = {
  tropical: [
    { t: "Se ubica en torno a la línea ecuatorial.", clave: true },
    { t: "Las lluvias son constantes y hay bosques tropicales.", clave: true },
    { t: "Las temperaturas son cálidas durante todo el año." },
    { t: "La humedad es alta." },
  ],
  seco: [
    { t: "Las precipitaciones son escasas.", clave: true },
    { t: "Las temperaturas son altas durante el día." },
    { t: "Por la noche las temperaturas bajan." },
  ],
  templado: [
    { t: "No tiene temperaturas extremas: los veranos y los inviernos son moderados.", clave: true },
    { t: "Los veranos son cálidos y los inviernos, fríos." },
    { t: "Las precipitaciones son promedio." },
    { t: "Tiene cuatro estaciones." },
  ],
  continental: [
    { t: "El otoño y la primavera son estaciones muy cortas.", clave: true },
    { t: "Los veranos son muy cálidos y los inviernos, muy fríos.", clave: true },
    { t: "Tiene cuatro estaciones." },
  ],
  polar: [
    { t: "Las temperaturas son muy frías durante todo el año.", clave: true },
    { t: "Se presenta en las zonas polares del planeta.", clave: true },
    { t: "Está en la zona fría, más allá del círculo polar." },
  ],
  montana: [
    { t: "Es característico de las cordilleras.", clave: true },
    { t: "Se relaciona con la altitud.", clave: true },
    { t: "La altitud es uno de los factores que hacen variar el clima." },
  ],
};

const J10_CL_R3_KEY = "edinun_j10_cl_r3_v1";
function j10ClR3Build() {
  const i = j10PickIdx(J10_CL_LUGARES, 1, J10_CL_R3_KEY)[0];
  j10Commit(J10_CL_R3_KEY, [i], 5);
  const target = J10_CL_LUGARES[i];
  const otros = j10Shuffle(J10_CL_LUGARES.filter((l) => l.id !== target.id)).slice(0, 3);
  const opciones = j10Shuffle([target].concat(otros));
  // 3 pistas: una `clave` obligatoria + 2 del resto (sin FIFO: el banco por clima tiene
  // 3 o 4 pistas y guardar recientes lo dejaría sin de dónde elegir).
  const banco = J10_CL_PISTAS[target.clima];
  const cl = j10Shuffle(banco.filter((p) => p.clave));
  const resto = j10Shuffle(cl.slice(1).concat(banco.filter((p) => !p.clave)));
  const pistas = j10Shuffle([cl[0]].concat(resto.slice(0, 2)));
  return { target, opciones, pistas };
}

function R3Misterio({ onSolve, verifyRef }) {
  const [b] = useStateG(() => j10ClR3Build());
  const [abiertas, setAbiertas] = useStateG({});   // n -> true
  const [sel, setSel] = useStateG(null);
  const [verified, setVerified] = useStateG(false);

  function abrir(n) { if (verified) return; setAbiertas((s) => Object.assign({}, s, { [n]: true })); }
  function elegir(id) { if (verified) return; setSel(id); }

  function verificar() {
    if (verified || sel === null) return;
    setVerified(true);
    const acierto = sel === b.target.id;
    const elegido = b.opciones.find((l) => l.id === sel) || b.target;
    onSolve(acierto, {
      emoji: "🔎", a: "¿De qué lugar hablan las pistas?",
      userAnswer: elegido.n, correctAnswer: b.target.n,
    }, acierto ? 3 : 0);
  }
  verifyRef.current = verificar;

  function sobre(p, n) {
    const open = !!abiertas[n];
    return (
      <button key={n} onClick={() => abrir(n)} disabled={open || verified}
        style={{ flex: "1 1 0", minWidth: 0, height: 146, boxSizing: "border-box", borderRadius: 14, border: `3px solid ${open ? "#d9c48a" : "#f2c260"}`, background: open ? "linear-gradient(180deg,#fffdf6,#f6ecd2)" : "linear-gradient(180deg, rgba(46,94,150,0.5), rgba(11,38,66,0.62))", color: open ? "#3a2608" : "#fce9a8", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 6, padding: "8px 9px", cursor: (open || verified) ? "default" : "pointer", boxShadow: open ? "inset 0 1px 0 rgba(255,255,255,0.75), 0 4px 12px rgba(0,0,0,0.28)" : "0 4px 12px rgba(0,0,0,0.3)", transition: "all 0.16s ease" }}>
        {open ? (
          <span style={{ fontFamily: "var(--ed-font-ui)", fontSize: 11, lineHeight: 1.28, textAlign: "center", overflowWrap: "anywhere" }}>{p.t}</span>
        ) : (
          <>
            <span style={{ fontSize: 34, lineHeight: 1 }}>✉️</span>
            <span style={{ fontFamily: "var(--ed-font-display)", fontWeight: 800, fontSize: 11.5, letterSpacing: "0.04em" }}>PISTA {n + 1}</span>
          </>
        )}
      </button>
    );
  }

  function opcion(l) {
    const chosen = sel === l.id, esOk = verified && l.id === b.target.id;
    const esFallo = verified && chosen && l.id !== b.target.id;
    let border = "#d9c48a", bg = "linear-gradient(180deg,#fffdf6,#f6ecd2)", col = "#3a2608";
    if (!verified && chosen) { border = "#4fd8ff"; bg = "linear-gradient(180deg,#eaf9ff,#cdeeff)"; }
    if (esOk) { border = "#2ecc8f"; bg = "linear-gradient(180deg,rgba(72,224,154,0.96),rgba(26,143,95,0.94))"; col = "#06381f"; }
    else if (esFallo) { border = "#ff6b6b"; bg = "linear-gradient(180deg,rgba(255,139,139,0.94),rgba(178,47,47,0.92))"; col = "#fff"; }
    else if (verified) { bg = "linear-gradient(180deg,rgba(255,253,246,0.45),rgba(246,236,210,0.45))"; col = "rgba(58,38,8,0.4)"; }
    return (
      <button key={l.id} onClick={() => elegir(l.id)} disabled={verified}
        style={{ position: "relative", flex: "1 1 0", minWidth: 0, minHeight: 92, boxSizing: "border-box", borderRadius: 13, border: `2.5px solid ${border}`, background: bg, color: col, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 3, padding: "6px 5px 15px", cursor: verified ? "default" : "pointer", transform: (!verified && chosen) ? "translateY(-2px)" : "none", boxShadow: (!verified && chosen) ? "0 0 16px rgba(79,216,255,0.55), inset 0 1px 0 rgba(255,255,255,0.7)" : "inset 0 1px 0 rgba(255,255,255,0.7), 0 3px 9px rgba(0,0,0,0.24)", transition: "transform 0.12s ease" }}>
        <span style={{ fontSize: 24, lineHeight: 1 }}>{l.e}</span>
        <span style={{ fontFamily: "var(--ed-font-display)", fontWeight: 800, fontSize: 11, lineHeight: 1.1, textAlign: "center", overflowWrap: "anywhere" }}>{l.n}</span>
        {/* Al revelar, el lugar correcto muestra ADEMÁS su clima: es el dato que enseña la
            ronda, y la actividad 3 del cuaderno empareja justamente eso. Va sobre la
            franja de 15 px que el `paddingBottom` reserva siempre, así nada salta. */}
        {esOk && (
          <span style={{ position: "absolute", left: 3, right: 3, bottom: 2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", background: "linear-gradient(180deg,#ffe6a1,#f1c153)", border: "1.5px solid #e0a72c", borderRadius: 999, padding: "0 4px", fontFamily: "var(--ed-font-display)", fontWeight: 800, fontSize: 8.5, color: "#5a3d0a" }}>
            clima {(J10_CL_CLIMAS.find((c) => c.id === l.clima) || J10_CL_CLIMAS[0]).n.toLowerCase()}
          </span>
        )}
        {(esOk || esFallo) && (
          <span style={{ position: "absolute", top: -9, right: -7, fontSize: 11, fontWeight: 900, color: "#fff", background: esOk ? "#1f8a54" : "#c0392b", borderRadius: "50%", width: 19, height: 19, display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 2px 5px rgba(0,0,0,0.35)" }}>{esOk ? "✓" : "✗"}</span>
        )}
      </button>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-start", height: "100%", width: "100%", paddingTop: 58 }}>
      <div style={{ pointerEvents: "none", textAlign: "center", textShadow: "0 2px 8px rgba(0,0,0,0.6)" }}>
        <span style={{ fontFamily: "var(--ed-font-display)", fontWeight: 800, fontSize: 20, color: "#fff" }}>Descubre de qué lugar hablan las pistas.</span>
      </div>
      {/* Las pistas y los lugares son DOS pasos distintos (primero abrir, luego elegir):
          van separados 32 px, no 14, para que no se lean como una sola parrilla de
          tarjetas. Lo pidió la autora (2026-09-23) y la zona lo permite: el bloque
          quedaba con aire de sobra por debajo. */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 32, minHeight: 0, width: "100%" }}>
        <div style={{ display: "flex", gap: 13, width: "100%", flexShrink: 0 }}>{b.pistas.map((p, n) => sobre(p, n))}</div>
        <div style={{ display: "flex", gap: 10, width: "100%", flexShrink: 0 }}>{b.opciones.map((l) => opcion(l))}</div>
      </div>
    </div>
  );
}

// ── Arreglo de rondas del TEMA 3 (3 rondas, 3 verbos: lanzar · girar · destapar) ──
const J10_ROUNDS_CLIMA = [
  { C: R1Noticias, verify: true, bubble: (<>Arrastra la noticia<br />a CLIMA o a TIEMPO.</>) },
  { C: R2Ruleta, verify: true, bubble: (<>Gira la ruleta hasta<br />poner ese clima<br />bajo la flecha.</>) },
  { C: R3Misterio, verify: true, bubble: (<>Abre las pistas.<br />Luego toca el lugar.</>) },
];

// ── Arreglo de rondas del TEMA 2 (3 rondas, 3 verbos: ordenar · buscar · estirar) ──
const J10_ROUNDS_S21 = [
  { C: R1Linea, verify: true, bubble: (<>Arrastra la tarjeta<br />hasta su lugar.</>) },
  { C: R2Lupa, verify: true, bubble: (<>Eres detective.<br />Mira y marca<br />las cuatro.</>) },
  { C: R3Grafico, verify: true, bubble: (<>Arrastra los puntos<br />del gráfico.</>) },
];

// ── Arreglo de rondas del TEMA 1 (3 rondas, 3 verbos: arrastrar · tocar · elegir) ──
const J10_ROUNDS = [
  // ⚠ El bocadillo decía "sobre el mapa" y la autora preguntó "¿a qué mapa se refiere?":
  // el panel son 4 zonas de color, no una silueta reconocible del Ecuador. El CÓMO no
  // puede nombrar algo que el niño no ve en pantalla.
  { C: R1Mapa, verify: true, bubble: (<>Arrastra la ficha<br />hasta su región.</>) },
  // ⚠ Decía "Toca la franja en el dibujo" cuando la R2 era un corte con la Antártida al
  // costado. Ahora son seis opciones en lista: ya no hay "dibujo" que tocar. Misma regla
  // que el "mapa" de la R1 y el "hueco" de la R3 — el bocadillo solo nombra lo que se ve.
  { C: R2Ascensor, verify: false, bubble: (<>Toca la que creas<br />correcta.</>) },
  // ⚠ Decía "Toca la opción correcta en cada hueco" y la autora lo rechazó: "hueco" es
  // vocabulario de diseño (el slot vacío de un formulario), no de un niño de 8 años. El
  // bocadillo no puede nombrar la mecánica con jerga interna. Cortado en 3 renglones para
  // que el más largo sea corto y el globo no se acerque tanto a la ficha.
  { C: R3Ficha, verify: true, bubble: (<>Toca las tres<br />respuestas<br />correctas.</>) },
];

// ══════════════════════════════════════════════════════════════════
// ORQUESTADOR compartido por TODOS los temas — chrome EDINUN (HUD, personaje, acciones,
// overlay, modales). Recibe el arreglo de rondas del tema activo.
// ⭐ = +1 por ELEMENTO resuelto bien (R1 hasta 4 fichas · R3 hasta 3 huecos) y +3 de una
// vez en la R2, que se resuelve con un solo toque → **10 máximo**. `isCorrect` de la ronda
// = ronda perfecta. Fallar nunca resta.
// ══════════════════════════════════════════════════════════════════
function J10Game({ app, setApp, go, rounds }) {
  const char = CHARACTERS.find((c) => c.id === app.character) || CHARACTERS[0];
  const ROUNDS = rounds || J10_ROUNDS;
  const total = ROUNDS.length;
  const [round, setRound] = useStateG(0);
  const [stars, setStars] = useStateG(0);
  const [log, setLog] = useStateG([]);
  const [elapsed, setElapsed] = useStateG(0);
  const [feedback, setFeedback] = useStateG(null);
  const [feedbackMsg, setFeedbackMsg] = useStateG("");
  const [confirmingExit, setConfirmingExit] = useStateG(false);
  const [confirmingRestart, setConfirmingRestart] = useStateG(false);
  const [pendingTema, setPendingTema] = useStateG(null);   // id del tema al que se quiere saltar
  // Una ronda puede REEMPLAZAR su bocadillo (`setBubble`). Lo necesita la R3 del Tema 2:
  // sortea barras o pastel, y con un solo texto para los dos casos el CÓMO salía vago
  // ("arrastra los puntos del gráfico") — la autora no lo entendía. Se resetea al cambiar
  // de ronda para que la siguiente arranque con el suyo.
  const [bubbleOv, setBubbleOv] = useStateG(null);
  const [rk, setRk] = useStateG(0);
  const [busy, setBusy] = useStateG(false);
  const started = useRefG(Date.now());
  const advancing = useRefG(false);
  const verifyRef = useRefG(null);

  useEffectG(() => { const t = setInterval(() => setElapsed(Math.floor((Date.now() - started.current) / 1000)), 500); return () => clearInterval(t); }, []);
  function formatTime(s) { const m = Math.floor(s / 60), ss = s % 60; return `${String(m).padStart(2, "0")}:${String(ss).padStart(2, "0")}`; }

  function onSolve(isCorrect, entry, gained) {
    if (advancing.current) return;
    advancing.current = true; setBusy(true);
    if (typeof markFirstAttempt === "function") markFirstAttempt();
    const g = typeof gained === "number" ? gained : (isCorrect ? 1 : 0);
    const newLog = [...log, { idx: round + 1, isCorrect, ...entry }];
    const newStars = stars + g;
    setLog(newLog); setStars(newStars);
    if (g > 0) setApp((s) => ({ ...s, stars: (s.stars || 0) + g }));
    const showFbAt = isCorrect ? 900 : 2400;
    const advanceAt = showFbAt + (isCorrect ? 1100 : 1000);
    // ⚠ En "¡UPS!" NUNCA se muestran estrellas, aunque la ronda haya dado algunas: se veía
    // "¡UPS!" con "+2 ⭐" debajo, que es contradictorio. Convención de todo el repo:
    // acierto → "+N ⭐" · fallo → frase de ánimo. Lo ganado igual sube en el ⭐ del HUD.
    setTimeout(() => { setFeedback(isCorrect ? "ok" : "err"); setFeedbackMsg(isCorrect ? `+${g} ⭐` : ANIMOS[round % ANIMOS.length]); }, showFbAt);
    setTimeout(() => {
      setFeedback(null); setFeedbackMsg("");
      if (round + 1 < total) { setBubbleOv(null); setRound((r) => r + 1); advancing.current = false; setBusy(false); }
      else {
        const solved = newLog.filter((e) => e.isCorrect).length;
        setApp((s) => ({ ...s, stars: newStars, lastResult: { category: app.currentCatLabel || CAT_LABEL, solved, total, time: Math.floor((Date.now() - started.current) / 1000), starsEarned: newStars, log: newLog } }));
        if (typeof incrementGamesCompleted === "function") incrementGamesCompleted();
        go("results");
      }
    }, advanceAt);
  }

  function confirmRestart() {
    setConfirmingRestart(false); advancing.current = false; setBusy(false);
    setRound(0); setStars(0); setLog([]); setFeedback(null); setFeedbackMsg(""); setBubbleOv(null); setRk((k) => k + 1);
    started.current = Date.now();
  }

  const Comp = ROUNDS[round].C;
  return (
    <div style={{ position: "absolute", inset: 0, overflow: "hidden" }}>
      <div style={{ position: "absolute", top: 10, left: 16, right: 16, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
        <EdinunLogoMini size={64} />
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, background: "rgba(0,0,0,0.35)", borderRadius: 999, padding: "6px 12px", border: "1px solid rgba(242,194,96,0.4)", fontFamily: "var(--ed-font-mono)", fontSize: 13, color: "#fce9a8" }}>⏱ {formatTime(elapsed)}</div>
          <div style={{ display: "flex", alignItems: "center", gap: 6, background: "rgba(0,0,0,0.35)", borderRadius: 999, padding: "6px 12px", border: "1px solid rgba(242,194,96,0.4)", fontFamily: "var(--ed-font-display)", fontWeight: 600, color: "#fce9a8" }}>⭐ {stars}</div>
        </div>
      </div>

      {/* Pastillas de TEMA en el HUD (patrón de juego-13): permiten saltar de tema SIN
          volver al Home. Mientras los temas 2 y 3 estén sin material, se ve una sola
          pastilla y funciona como la pastilla estática de catLabel (§1). */}
      <div style={{ position: "absolute", top: 14, left: "50%", transform: "translateX(-50%)", display: "flex", alignItems: "center", gap: 8 }}>
        {LEVELS_CFG.filter((lv) => lv.enabled).map((lv) => {
          const activo = lv.id === (app.currentCategory || "recursos");
          return (
            <button key={lv.id} onClick={() => { if (!activo && !busy) setPendingTema(lv.id); }} disabled={activo}
              style={{ padding: "6px 13px", borderRadius: 999, background: activo ? lv.grad : "rgba(0,0,0,0.32)", color: activo ? lv.ink : "rgba(255,255,255,0.82)", fontFamily: "var(--ed-font-display)", fontWeight: 800, fontSize: 11.5, letterSpacing: "0.04em", border: activo ? "2px solid rgba(255,255,255,0.55)" : "2px solid rgba(255,255,255,0.2)", boxShadow: activo ? "0 0 14px rgba(252,233,168,0.45)" : "none", cursor: activo ? "default" : "pointer", transition: "all 0.15s ease" }}>
              {lv.short || lv.label}
            </button>
          );
        })}
      </div>

      {/* ⚠ El bloque Ronda va en `top: 74`, NO en 52. El 52 del estándar se fijó ANTES de
          que existieran las pastillas de tema; con ellas ocupando 14→44, el bloque quedaba
          a 8 px de las pastillas y a 51 px del enunciado — mal repartido, reportado por la
          autora (2026-09-04). En 74 quedan 30 px arriba y 29 abajo.
          Regla nueva: **52 sin pastillas · 74 con pastillas** (el format-lint acepta las
          dos). ⏳ Falta propagarlo a juego-3, juego-4, juego-5 y juego-13, que tienen el
          mismo problema. */}
      <div style={{ position: "absolute", top: 74, left: "50%", transform: "translateX(-50%)", display: "flex", alignItems: "center", gap: 8 }}>
        <span className="ed-label" style={{ color: "rgba(255,255,255,0.7)", fontSize: 11 }}>Ronda</span>
        {Array.from({ length: total }).map((_, i) => {
          const done = i < log.length, ok = done && log[i] && log[i].isCorrect;
          return <div key={i} style={{ width: 11, height: 11, borderRadius: "50%", background: done ? (ok ? "#fce9a8" : "#ff6b6b") : (i === round ? "rgba(255,255,255,0.6)" : "rgba(255,255,255,0.2)"), boxShadow: done ? "0 0 8px currentColor" : "none", color: ok ? "#fce9a8" : "#ff6b6b" }} />;
        })}
      </div>

      <div style={{ position: "absolute", left: 8, bottom: 78, width: 220, pointerEvents: "none", textAlign: "center" }}>
        <div className="ed-float-soft" style={{ position: "absolute", left: 0, right: 0, bottom: "100%", display: "flex", justifyContent: "center" }}>
          <div style={{ position: "relative", display: "inline-block", maxWidth: 210, background: "linear-gradient(180deg, rgba(20,12,55,0.95), rgba(10,6,35,0.95))", border: "1.5px solid rgba(242,194,96,0.65)", borderRadius: 16, padding: "10px 14px", fontFamily: "var(--ed-font-display)", fontWeight: 700, fontSize: 14, lineHeight: 1.3, color: "#fce9a8", textAlign: "center", boxShadow: "inset 0 1px 0 rgba(255,255,255,0.08)" }}>
            {bubbleOv || ROUNDS[round].bubble}
            <div style={{ position: "absolute", bottom: -10, left: "50%", transform: "translateX(-50%)", width: 0, height: 0, borderLeft: "9px solid transparent", borderRight: "9px solid transparent", borderTop: "10px solid rgba(20,12,55,0.95)", filter: "drop-shadow(0 1px 0 rgba(242,194,96,0.55))" }} />
          </div>
        </div>
        <div style={{ position: "relative", display: "flex", justifyContent: "center" }}>
          <div style={{ position: "absolute", bottom: 14, left: "50%", transform: "translateX(-50%)", width: 140, height: 16, borderRadius: "50%", background: "radial-gradient(ellipse, rgba(242,194,96,0.45), transparent 70%)", filter: "blur(5px)" }} />
          <char.Component size={186} floating />
        </div>
        <div style={{ marginTop: -2, fontFamily: "var(--ed-font-display)", fontWeight: 700, fontSize: 14, color: "#fce9a8", letterSpacing: "0.04em", textShadow: "0 2px 6px rgba(0,0,0,0.6)" }}>{char.name}</div>
      </div>

      <div style={{ position: "absolute", top: 60, bottom: 18, left: 215, right: 215 }}>
        <Comp key={`r${round}-${rk}`} onSolve={onSolve} verifyRef={verifyRef} setBubble={setBubbleOv} />
      </div>

      <div style={{ position: "absolute", right: 18, top: "50%", transform: "translateY(-50%)", display: "flex", flexDirection: "column", gap: 12, width: 150 }}>
        {ROUNDS[round].verify && !busy && (
          <button className="ed-btn" onClick={() => verifyRef.current && verifyRef.current()} style={{ fontSize: 15, padding: "0 10px", height: 56, fontWeight: 800, letterSpacing: "0.04em", background: "linear-gradient(180deg, #4fe08a, #1f9d57)", color: "#06381f", border: "none" }}>¡VERIFICAR!</button>
        )}
        <button className="ed-btn ed-btn-restart" onClick={() => setConfirmingRestart(true)} style={{ fontSize: 15, padding: "0 10px", height: 56, fontWeight: 800, letterSpacing: "0.04em" }}>REINICIAR</button>
        <button className="ed-btn ed-btn-ghost" onClick={() => setConfirmingExit(true)} style={{ fontSize: 15, padding: "0 10px", height: 56, fontWeight: 800, letterSpacing: "0.04em" }}>SALIR</button>
      </div>

      {feedback && (
        <PortalToBody>
          <div style={{ position: "fixed", inset: 0, zIndex: 1000, pointerEvents: "none", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, background: "rgba(0,0,0,0.55)", backdropFilter: "blur(3px)", animation: "ed-pop-in 0.3s" }}>
            <div style={{ fontFamily: "'Fredoka','Baloo 2',system-ui,sans-serif", fontWeight: 700, fontSize: "clamp(56px, 11vmin, 120px)", color: feedback === "ok" ? "#2ecc8f" : "#ff6b6b", textShadow: "0 4px 0 rgba(0,0,0,0.45), 0 0 60px currentColor" }}>{feedback === "ok" ? "¡EXCELENTE!" : "¡UPS!"}</div>
            {feedbackMsg && (<div style={{ fontFamily: "'Fredoka','Baloo 2',system-ui,sans-serif", fontWeight: 700, fontSize: "clamp(18px, 2.6vmin, 30px)", color: feedback === "ok" ? "#fce9a8" : "#fff", background: "rgba(0,0,0,0.55)", padding: "8px 26px", borderRadius: 999, textShadow: "0 2px 6px rgba(0,0,0,0.6)", textAlign: "center" }}>{feedback === "err" && feedbackMsg.indexOf("⭐") === -1 ? `${feedbackMsg} — ${char.name}` : feedbackMsg}</div>)}
          </div>
        </PortalToBody>
      )}

      {pendingTema && (() => {
        const cfg = LEVELS_CFG.find((l) => l.id === pendingTema) || LEVELS_CFG[0];
        return (
          <PortalToBody>
            <div onClick={() => setPendingTema(null)} style={{ position: "fixed", inset: 0, zIndex: 1000, background: "rgba(0,0,0,0.62)", backdropFilter: "blur(4px)", display: "flex", alignItems: "center", justifyContent: "center", animation: "ed-pop-in 0.18s", padding: 16 }}>
              <div onClick={(e) => e.stopPropagation()} className="ed-card" style={{ padding: 24, maxWidth: 440, textAlign: "center", boxShadow: "var(--ed-shadow-card), 0 0 40px rgba(79,216,255,0.28)" }}>
                <div className="ed-label" style={{ color: "#4fd8ff", marginBottom: 6 }}>Cambiar de tema</div>
                <h2 className="ed-h1" style={{ fontSize: 22, lineHeight: 1.15, marginBottom: 8 }}>¿Ir a "{cfg.label}"?</h2>
                <p className="ed-body" style={{ marginBottom: 16, fontSize: 14 }}>Vas a perder lo de esta ronda.</p>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  <button className="ed-btn ed-btn-ghost" onClick={() => setPendingTema(null)} style={{ height: 44, fontWeight: 800, letterSpacing: "0.04em" }}>SEGUIR AQUÍ</button>
                  {/* Cambiar `currentCategory` basta: GameScreen monta J10Game con key={cat},
                      así que el tema nuevo entra con el estado en cero (ronda 1, sin ⭐). */}
                  <button className="ed-btn ed-btn-primary" onClick={() => { setPendingTema(null); setApp((s) => ({ ...s, currentCategory: cfg.id, currentCatLabel: cfg.catLabel })); }} style={{ height: 44, fontWeight: 800, letterSpacing: "0.04em" }}>SÍ, CAMBIAR</button>
                </div>
              </div>
            </div>
          </PortalToBody>
        );
      })()}

      {confirmingExit && (
        <PortalToBody>
          <div onClick={() => setConfirmingExit(false)} style={{ position: "fixed", inset: 0, zIndex: 1000, background: "rgba(0,0,0,0.62)", backdropFilter: "blur(4px)", display: "flex", alignItems: "center", justifyContent: "center", animation: "ed-pop-in 0.18s", padding: 16 }}>
            <div onClick={(e) => e.stopPropagation()} className="ed-card" style={{ padding: 24, maxWidth: 440, textAlign: "center", boxShadow: "var(--ed-shadow-card), 0 0 40px rgba(255,107,107,0.3)" }}>
              <div className="ed-label" style={{ color: "#ff8b8b", marginBottom: 6 }}>Salir del juego</div>
              <h2 className="ed-h1" style={{ fontSize: 22, lineHeight: 1.15, marginBottom: 8 }}>¿Volver al inicio?</h2>
              <p className="ed-body" style={{ marginBottom: 16, fontSize: 14 }}>Vas a perder lo de esta ronda.</p>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <button className="ed-btn ed-btn-ghost" onClick={() => setConfirmingExit(false)} style={{ height: 44, fontWeight: 800, letterSpacing: "0.04em" }}>SEGUIR JUGANDO</button>
                <button className="ed-btn ed-btn-primary" onClick={() => { setConfirmingExit(false); go("home"); }} style={{ height: 44, fontWeight: 800, letterSpacing: "0.04em" }}>SÍ, SALIR</button>
              </div>
            </div>
          </div>
        </PortalToBody>
      )}

      {confirmingRestart && (
        <PortalToBody>
          <div onClick={() => setConfirmingRestart(false)} style={{ position: "fixed", inset: 0, zIndex: 1000, background: "rgba(0,0,0,0.62)", backdropFilter: "blur(4px)", display: "flex", alignItems: "center", justifyContent: "center", animation: "ed-pop-in 0.18s", padding: 16 }}>
            <div onClick={(e) => e.stopPropagation()} className="ed-card" style={{ padding: 24, maxWidth: 440, textAlign: "center", boxShadow: "var(--ed-shadow-card), 0 0 40px rgba(155,123,232,0.3)" }}>
              <div className="ed-label" style={{ color: "#c4a8ff", marginBottom: 6 }}>Reiniciar juego</div>
              <h2 className="ed-h1" style={{ fontSize: 22, lineHeight: 1.15, marginBottom: 8 }}>¿Empezar de nuevo?</h2>
              <p className="ed-body" style={{ marginBottom: 16, fontSize: 14 }}>Vas a jugar las {total} rondas otra vez.</p>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <button className="ed-btn ed-btn-ghost" onClick={() => setConfirmingRestart(false)} style={{ height: 44, fontWeight: 800, letterSpacing: "0.04em" }}>SEGUIR JUGANDO</button>
                <button className="ed-btn ed-btn-primary" onClick={confirmRestart} style={{ height: 44, fontWeight: 800, letterSpacing: "0.04em" }}>SÍ, REINICIAR</button>
              </div>
            </div>
          </div>
        </PortalToBody>
      )}
    </div>
  );
}

// Despacho por tema (estandar-visual §8: N botones = N mini-juegos con mecánicas
// distintas). Los TRES temas están implementados, con NUEVE verbos distintos entre
// ellos. Una categoría desconocida cae en el Tema 1 en vez de romperse.
const J10_ROUNDS_POR_TEMA = { recursos: J10_ROUNDS, siglo21: J10_ROUNDS_S21, clima: J10_ROUNDS_CLIMA };
function GameScreen({ app, setApp, go }) {
  const cat = app.currentCategory || "recursos";
  const rounds = J10_ROUNDS_POR_TEMA[cat] || J10_ROUNDS;
  // `key={cat}`: al saltar de tema desde las pastillas del HUD, J10Game se REMONTA y el
  // tema nuevo arranca limpio (ronda 1, sin ⭐ ni log de la partida anterior).
  return <J10Game key={cat} app={app} setApp={setApp} go={go} rounds={rounds} />;
}

// app.jsx — Shell de producción EDINUN GAMES.
// Enrutador por estado y device stage adaptativo (desktop / tablet / mobile).
// Móvil portrait: el contenido NUNCA rota; un overlay BLOQUEANTE obliga
// al usuario a girar físicamente el teléfono antes de poder usar la app.

const { useState: useStateA, useEffect: useEffectA, useRef: useRefA } = React;

// ─────────────────────────────────────────────────────────────
// useViewportSize — devuelve el tamaño REAL visible del viewport.
//
// En iOS Safari (y otros mobile browsers), `window.innerHeight` y `100vh`
// reportan la altura de la ventana INCLUYENDO la URL bar, así que el
// contenido escalado a esa altura termina parcialmente fuera de pantalla
// (ej: el numpad del juego queda debajo del fondo visible). La Visual
// Viewport API reporta el área verdaderamente visible y se actualiza
// cuando la URL bar se muestra/oculta.
// ─────────────────────────────────────────────────────────────
// Detección de "resize REAL" vs "zoom del navegador".
//
// Idea: el tamaño FÍSICO de la zona visible en píxeles del display es
// invariante al ctrl+rueda. Cuando subes el zoom de 100 % a 500 %:
//   · innerWidth en CSS-px se divide entre 5
//   · devicePixelRatio se multiplica por 5
//   · innerWidth × devicePixelRatio queda igual ⇒ NO hubo resize real.
//
// Cuando arrastras la esquina de la ventana o rotas el dispositivo:
//   · innerWidth en CSS-px cambia
//   · devicePixelRatio NO cambia
//   · innerWidth × devicePixelRatio cambia ⇒ SÍ hubo resize real.
//
// Por eso comparamos contra `innerWidth × devicePixelRatio` y solo
// actualizamos el state cuando ese producto cambia. Así el lienzo se
// queda con su tamaño CSS previo durante el zoom y el navegador lo
// amplifica visualmente — junto con los glifos, que ya leen `glyphSize`
// del mismo state defendido (ver DeviceStage).
//
// La defensa anterior (tracker de _lastDPR) era frágil: se actualizaba
// en CADA evento, así que si el navegador disparaba dos resize seguidos
// para la misma acción de zoom, el segundo veía el dpr ya guardado y
// recalculaba el tamaño con el viewport pequeño. Esto causaba que los
// glifos quedaran enormes mientras el lienzo se recomprimía.
function physicalSize() {
  if (typeof window === "undefined") return { w: 0, h: 0 };
  const dpr = window.devicePixelRatio || 1;
  return { w: window.innerWidth * dpr, h: window.innerHeight * dpr };
}
let _lastPhysical = physicalSize();

function useViewportSize() {
  const [size, setSize] = useStateA(() => readSize());
  useEffectA(() => {
    function onChange() {
      const phys = physicalSize();
      // Tolerancia de 4 px reales para absorber redondeos del navegador.
      if (Math.abs(phys.w - _lastPhysical.w) < 4 && Math.abs(phys.h - _lastPhysical.h) < 4) {
        // Mismo display, distinto zoom — no actualizamos el state.
        return;
      }
      _lastPhysical = phys;
      setSize(readSize());
    }
    window.addEventListener("resize", onChange);
    window.addEventListener("orientationchange", onChange);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", onChange);
    }
    return () => {
      window.removeEventListener("resize", onChange);
      window.removeEventListener("orientationchange", onChange);
      if (window.visualViewport) {
        window.visualViewport.removeEventListener("resize", onChange);
      }
    };
  }, []);
  return size;
}
function readSize() {
  if (typeof window === "undefined") return { vw: 0, vh: 0 };
  const vv = window.visualViewport;
  // Cuando el usuario hace pinch-zoom, vv.scale > 1 y vv.width/height
  // reflejan la región visible (más pequeña). Usar esos valores haría
  // que la escala del lienzo se reduzca al hacer zoom — exactamente lo
  // contrario de lo que el usuario quiere. Solo confiamos en vv cuando
  // scale ≈ 1 (sin zoom) — ahí da una lectura más fiel que innerWidth/
  // Height en iOS Safari (descuenta correctamente la URL bar visible).
  if (vv && Math.abs(vv.scale - 1) < 0.05) {
    return { vw: vv.width, vh: vv.height };
  }
  return { vw: window.innerWidth, vh: window.innerHeight };
}

// ─────────────────────────────────────────────────────────────
// DeviceStage — escala el lienzo lógico 900×540 (paisaje) al viewport.
//
// Reglas:
//   · Desktop / tablet: sin marco, sin notch, fondo cósmico edge-to-edge.
//   · Mobile portrait: lienzo letterboxed Y overlay BLOQUEANTE "Gira el
//     teléfono". El contenido del juego no es accesible hasta que rote.
//   · Mobile landscape: lienzo escalado al viewport visible (visualViewport,
//     no innerHeight, para no clippearse debajo de la URL bar de iOS).
// ─────────────────────────────────────────────────────────────
function DeviceStage({ children, variant = "cosmic" }) {
  const W = 900, H = 540;
  const { vw, vh } = useViewportSize();
  const minSide = Math.min(vw, vh);
  const maxSide = Math.max(vw, vh);
  let mode = "desktop";
  if (maxSide < 820) mode = "mobile";
  else if (minSide < 820) mode = "tablet";
  const portrait = vh > vw;
  const baseScale = Math.max(Math.min(vw / W, vh / H), 0.15);

  // Detección de teléfono independiente del modo: cualquier dispositivo con
  // lado menor ≤ 600 CSS-px es un teléfono. Cubre todos los teléfonos
  // actuales (iPhone SE 320 → S25 Ultra/Pro Max ~432) con margen para
  // modelos futuros más anchos. La menor tablet (iPad mini 744) queda
  // bien por encima, así que no se rompe el caso "tablet portrait usable
  // letterboxed". Solo bloqueamos cuando teléfono Y portrait — el lienzo
  // paisaje queda demasiado pequeño para jugar.
  const isPhone = minSide <= 600;
  const lockPortrait = isPhone && portrait;

  // Tamaño de los glifos del fondo: equivalente al `clamp(48px, 7vmin, 110px)`
  // que tenía el CSS, pero calculado a partir del vw/vh DEFENDIDO contra
  // cambios de DPR. Esto evita que con ctrl+rueda del mouse los glifos
  // crezcan más rápido que el lienzo (el lienzo se congela vía la defensa
  // del DPR; si CSS lee el vmin actual, los glifos no se congelan y desync).
  const glyphSize = Math.max(48, Math.min(minSide * 0.07, 110));

  const debug = typeof window !== "undefined" && /(?:^|[#&])debug(?:&|$)/.test(window.location.hash || "");

  // ─── Pinch-zoom y pan custom ─────────────────────────────────
  // Reemplaza el zoom nativo del browser. Razón: con el lienzo letterboxed
  // dentro de un wrapper viewport-sized, el visual viewport del browser
  // puede panear hasta dejar al usuario mirando solo el cosmos vacío de los
  // bordes — el "rebote" reportado en iPhone (ver .planning/ios-zoom.md).
  // Aquí los gestos operan sobre el transform del lienzo, así que el zoom
  // siempre gravita alrededor del contenido y no deriva a un borde
  // decorativo.
  const wrapperRef = useRefA(null);
  const gestureRef = useRefA(null);
  const stateRef = useRefA({ userZoom: 1, pan: { x: 0, y: 0 } });
  const [userZoom, setUserZoom] = useStateA(1);
  const [pan, setPan] = useStateA({ x: 0, y: 0 });
  const [duringGesture, setDuringGesture] = useStateA(false);

  useEffectA(() => {
    stateRef.current = { userZoom, pan };
  }, [userZoom, pan]);

  // Reset al cambiar viewport (rotación, resize). Si no, el pan queda
  // referenciado a un viewport que ya no existe.
  useEffectA(() => {
    setUserZoom(1);
    setPan({ x: 0, y: 0 });
    setDuringGesture(false);
  }, [vw, vh]);

  useEffectA(() => {
    if (lockPortrait) return;
    const el = wrapperRef.current;
    if (!el) return;

    const Z_MIN = 1;
    const Z_MAX = 4;

    const dist = (a, b) => Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
    const mid = (a, b) => ({ x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 });

    function clampPan(zoom, px, py) {
      // Pan máximo: la mitad del exceso del lienzo escalado sobre el viewport.
      // En zoom=1 el max es 0 (lienzo cabe en viewport, no hay donde panear).
      // En zoom=N el lienzo mide N veces el lado contain, así que el usuario
      // puede mover ±(sw - vw)/2 antes de que la orilla del lienzo cruce la
      // orilla del viewport. Esto evita perder el contenido fuera de pantalla.
      const sw = baseScale * zoom * W;
      const sh = baseScale * zoom * H;
      const maxX = Math.max(0, (sw - vw) / 2);
      const maxY = Math.max(0, (sh - vh) / 2);
      return {
        x: Math.max(-maxX, Math.min(maxX, px)),
        y: Math.max(-maxY, Math.min(maxY, py)),
      };
    }

    function applyState(z, px, py) {
      stateRef.current = { userZoom: z, pan: { x: px, y: py } };
      setUserZoom(z);
      setPan({ x: px, y: py });
    }

    function onTouchStart(e) {
      const { userZoom: z0, pan: p0 } = stateRef.current;
      if (e.touches.length >= 2) {
        const [t0, t1] = e.touches;
        gestureRef.current = {
          mode: "pinch",
          d0: dist(t0, t1),
          m0: mid(t0, t1),
          z0, p0: { ...p0 },
        };
        setDuringGesture(true);
        e.preventDefault();
      } else if (e.touches.length === 1) {
        const t = e.touches[0];
        gestureRef.current = {
          mode: "pan-armed",
          startX: t.clientX,
          startY: t.clientY,
          z0, p0: { ...p0 },
        };
        // No preventDefault — un tap simple debe seguir generando click.
      }
    }

    function onTouchMove(e) {
      const g = gestureRef.current;
      if (!g) return;

      // Si en medio de un gesto entra un segundo dedo, transición a pinch
      // tomando el estado actual como punto de partida.
      if (e.touches.length >= 2 && g.mode !== "pinch") {
        const [t0, t1] = e.touches;
        const { userZoom: zNow, pan: pNow } = stateRef.current;
        gestureRef.current = {
          mode: "pinch",
          d0: dist(t0, t1),
          m0: mid(t0, t1),
          z0: zNow, p0: { ...pNow },
        };
        setDuringGesture(true);
        e.preventDefault();
        return;
      }

      if (e.touches.length >= 2 && g.mode === "pinch") {
        const [t0, t1] = e.touches;
        const d = dist(t0, t1);
        const m = mid(t0, t1);
        const ratio = d / g.d0;
        // Permitimos pasar transitoriamente bajo Z_MIN para sensación elástica
        // durante el gesto; en touchend hacemos snap-back al rango válido.
        const newZoom = Math.max(Z_MIN * 0.7, Math.min(Z_MAX * 1.05, g.z0 * ratio));
        const r = newZoom / g.z0;
        const ux = g.m0.x - vw / 2;
        const uy = g.m0.y - vh / 2;
        // Fórmula que mantiene el punto medio de la pinza anclado al mismo
        // píxel del lienzo durante todo el gesto. Derivación:
        //   panX_new = (mx0 - vw/2) + (newZoom/z0) * (panX0 - (mx0 - vw/2))
        //              + (mx_now - mx0)   ← desplazamiento del propio gesto
        const newPanX = ux + r * (g.p0.x - ux) + (m.x - g.m0.x);
        const newPanY = uy + r * (g.p0.y - uy) + (m.y - g.m0.y);
        applyState(newZoom, newPanX, newPanY);
        e.preventDefault();
      } else if (e.touches.length === 1 && g.mode === "pan-armed") {
        if (g.z0 <= 1.001) return; // sin zoom no panea — dejamos pasar el tap
        const t = e.touches[0];
        const dx = t.clientX - g.startX;
        const dy = t.clientY - g.startY;
        if (Math.hypot(dx, dy) > 8) {
          gestureRef.current = { ...g, mode: "pan" };
          setDuringGesture(true);
          e.preventDefault();
        }
      } else if (e.touches.length === 1 && g.mode === "pan") {
        const t = e.touches[0];
        const dx = t.clientX - g.startX;
        const dy = t.clientY - g.startY;
        applyState(g.z0, g.p0.x + dx, g.p0.y + dy);
        e.preventDefault();
      }
    }

    function onTouchEnd(e) {
      const g = gestureRef.current;
      if (!g) return;
      if (e.touches.length === 0) {
        const { userZoom: z, pan: p } = stateRef.current;
        const clampedZ = Math.max(Z_MIN, Math.min(Z_MAX, z));
        let cp;
        if (clampedZ <= 1.001) {
          cp = { x: 0, y: 0 };
        } else {
          cp = clampPan(clampedZ, p.x, p.y);
        }
        applyState(clampedZ, cp.x, cp.y);
        setDuringGesture(false);
        gestureRef.current = null;
      }
    }

    el.addEventListener("touchstart", onTouchStart, { passive: false });
    el.addEventListener("touchmove", onTouchMove, { passive: false });
    el.addEventListener("touchend", onTouchEnd, { passive: false });
    el.addEventListener("touchcancel", onTouchEnd, { passive: false });

    return () => {
      el.removeEventListener("touchstart", onTouchStart);
      el.removeEventListener("touchmove", onTouchMove);
      el.removeEventListener("touchend", onTouchEnd);
      el.removeEventListener("touchcancel", onTouchEnd);
    };
  }, [vw, vh, baseScale, lockPortrait]);

  const totalScale = baseScale * userZoom;

  return (
    <div ref={wrapperRef} style={{
      width: "100vw", height: "100dvh",
      minHeight: "-webkit-fill-available",
      overflow: "hidden",
      position: "relative",
      background: variant === "chalkboard" ? "#0b3a2d" : "#050214",
      // `touch-action: none` desactiva todos los gestos que el browser
      // interpretaría por su cuenta (pinch, pan, doble-tap-zoom). Los
      // implementamos en JS sobre el transform del lienzo para que el
      // zoom siempre quede anclado al contenido y nunca derive a los
      // bordes letterbox del wrapper. Los click/tap en botones siguen
      // funcionando — esto solo bloquea gestos del browser, no eventos.
      touchAction: "none",
    }}>
      <CosmosBg variant={variant} glyphSize={glyphSize} />

      {/* Lienzo lógico 900×540 centrado y escalado.
          El transform combina el escalado base (contain del viewport),
          el zoom del usuario y el pan acumulado. El orden CSS es
          right-to-left: scale → translate(pan) → translate(-50%,-50%). */}
      <div style={{
        width: W, height: H,
        position: "absolute",
        left: "50%", top: "50%",
        transform: `translate(-50%, -50%) translate(${pan.x}px, ${pan.y}px) scale(${totalScale})`,
        transformOrigin: "center center",
        overflow: "hidden",
        // Sin transición durante el gesto activo (el lienzo sigue la pinza
        // al instante); con transición elástica al soltar, para que el
        // snap-back de zoom/pan a los límites válidos no sea abrupto.
        transition: duringGesture ? "none" : "transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1)",
        willChange: "transform",
      }}>
        {children}
      </div>

      {lockPortrait && <RotateLockOverlay />}
      {debug && (
        <div style={{
          position: "fixed", top: 6, left: 6, zIndex: 999999,
          background: "rgba(0,0,0,0.85)", color: "#0f0",
          font: "11px ui-monospace,Menlo,monospace",
          padding: "6px 8px", borderRadius: 6,
          maxWidth: "90vw", whiteSpace: "pre",
          pointerEvents: "none",
        }}>
{`vw=${vw} vh=${vh}
min=${minSide} max=${maxSide}
mode=${mode} portrait=${portrait}
isPhone=${isPhone} LOCK=${lockPortrait}
zoom=${userZoom.toFixed(2)} pan=${pan.x.toFixed(0)},${pan.y.toFixed(0)}
vv=${typeof window!=="undefined" && window.visualViewport ? "yes" : "no"}
ua=${(typeof navigator!=="undefined" ? navigator.userAgent : "?").slice(0,60)}`}
        </div>
      )}
    </div>
  );
}

// Overlay bloqueante de rotación. En mobile portrait cubre toda la pantalla
// con un mensaje claro y un ícono animado. NO se puede descartar — el usuario
// DEBE girar el dispositivo para acceder al juego. Se desmonta solo cuando
// el viewport pasa a landscape.
function RotateLockOverlay() {
  return (
    <div
      role="dialog"
      aria-modal="true"
      aria-label="Gira tu teléfono para jugar"
      style={{
        position: "fixed", inset: 0, zIndex: 99999,
        background: "linear-gradient(180deg,#050214 0%,#0a0628 100%)",
        display: "flex", flexDirection: "column",
        alignItems: "center", justifyContent: "center",
        textAlign: "center", padding: "32px 24px",
        color: "#fce9a8",
        fontFamily: "var(--ed-font-display, system-ui)",
      }}
    >
      <div
        style={{
          width: 132, height: 132, marginBottom: 28,
          display: "flex", alignItems: "center", justifyContent: "center",
          animation: "ed-rotate-lock 2.4s ease-in-out infinite",
        }}
        aria-hidden="true"
      >
        {/* Ícono de teléfono que rota */}
        <svg viewBox="0 0 100 100" width="120" height="120" fill="none">
          <rect x="36" y="14" width="28" height="72" rx="6"
                stroke="#f2c260" strokeWidth="3" fill="rgba(242,194,96,0.08)" />
          <rect x="42" y="22" width="16" height="48" rx="2" fill="rgba(242,194,96,0.18)" />
          <circle cx="50" cy="78" r="2.5" fill="#f2c260" />
        </svg>
      </div>
      <div style={{
        fontWeight: 800,
        fontSize: "clamp(18px, 5.2vw, 26px)",
        lineHeight: 1.15,
        textTransform: "uppercase", letterSpacing: "0.02em",
        marginBottom: 12,
      }}>
        Gira tu teléfono
      </div>
      <div style={{
        fontWeight: 500,
        fontSize: "clamp(13px, 4vw, 16px)",
        lineHeight: 1.4,
        color: "rgba(252,233,168,0.78)",
        maxWidth: "min(320px, 80vw)",
      }}>
        Pon tu teléfono de lado para jugar.
      </div>
      <style>{`
        @keyframes ed-rotate-lock {
          0%   { transform: rotate(0deg); }
          45%  { transform: rotate(0deg); }
          70%  { transform: rotate(-90deg); }
          100% { transform: rotate(-90deg); }
        }
      `}</style>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// App principal
// ─────────────────────────────────────────────────────────────
function App() {
  const [route, setRoute] = useStateA("home");
  const [app, setApp] = useStateA({
    studentName: "",
    character: "domi",
    level: "basic",
    stars: 0,
    sessionStart: Date.now(),
    gameSeed: 0,
  });

  function go(r) {
    // Al (re)entrar al juego, regeneramos la seed para que GameScreen se remonte
    // y reinicie ronda, tiempo, racha, etc. También reseteamos las estrellas:
    // cada partida empieza desde 0, no acumula entre rondas.
    if (r === "game") {
      setApp((s) => ({ ...s, gameSeed: (s.gameSeed || 0) + 1, stars: 0 }));
    }
    setRoute(r);
  }

  const screenProps = { app, setApp, go };

  let Screen = window.HomeScreen;
  if (route === "character") Screen = window.CharacterScreen;
  else if (route === "game") Screen = window.GameScreen;
  else if (route === "results") Screen = window.ResultsScreen;

  const variant = route === "game" ? "chalkboard" : "cosmic";

  return (
    <DeviceStage variant={variant}>
      <Screen key={route === "game" ? `game-${app.gameSeed}` : route} {...screenProps} />
    </DeviceStage>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
